plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shengjian.tts'
    compileSdk 34

    defaultConfig {
        applicationId 'com.shengjian.tts'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
